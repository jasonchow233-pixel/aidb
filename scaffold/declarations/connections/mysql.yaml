# ============================================================
# MySQL 连接描述符
# 对比 PG 看 traits 差异 —— 这些差异直接驱动 UI 提示
# ============================================================

schemaVersion: 1
order: 20
id: mysql
rustVariant: MySQL
label: MySQL
icon: mysql.svg

dialect: MySQL
runtimeMode: native
mcpMode: builtin
defaultPort: 3306
urlTemplate: "mysql://{user}:{password}@{host}:{port}/{database}"

traits:
  schemaAware: false               # ⭐ MySQL: database 即 schema，没有中间层
  singleDatabase: false
  clearableQuerySchema: true
  identityKind: autoIncrement      # ⭐ 与 PG 的 identity 不同 → 导出 DDL 不同
  sequenceObjects: false           # ⭐ 无独立序列 → UI 隐藏序列工作台
  transactionalDdl: false          # ⭐⭐ MySQL DDL 隐式提交 → UI 必须提示
  onlineDdlConcurrent: true        # ⭐ ONLINE / ALGORITHM=INPLACE
  multipleResultsets: false        # ⭐ 不支持一次返回多结果集
  savepoints: true
  explainFormats: [json, tree, text]
  maxParams: 0                     # 0 = 无限制
  identifierQuote: "`"
  paramStyle: positional           # ⭐ ?

capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: true
  sqlExplain: true
  userAdmin: true
  specializedSurface: false

compareModes: [schema, data]
transferSupportLevel: native
transferObjectFamily: mysql
supportLevel: full
