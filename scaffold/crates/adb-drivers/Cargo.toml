# ============================================================================
# crates/adb-drivers/Cargo.toml  —— 门面 crate
#
# ⭐ 设计来源: DBX `crates/dbx-drivers` (facade) + 7 个 per-driver crate
#    抄这个模式的原因：
#      1. 加新驱动 = 加一个 crate，本文件只加一行 pub use
#      2. 每个驱动独立编译单元，可单独 feature gate（只编 PG 不编 MySQL）
#      3. 上层只依赖一个门面，看不到内部有几个驱动
# ============================================================================

[package]
name = "adb-drivers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# ── 默认：核心四库 ──
default = ["driver-postgres", "driver-mysql", "driver-sqlite", "driver-redis"]

# ── 额外原生驱动（按需）──
driver-mongodb   = ["dep:adb-driver-mongodb"]
driver-clickhouse = ["dep:adb-driver-clickhouse"]

# ── JDBC 通道（长尾：达梦/金仓/OceanBase…，一个通道覆盖所有）──
driver-jdbc = ["dep:adb-driver-jdbc"]

# ── 便捷组合 ──
tier-1 = ["driver-postgres", "driver-mysql", "driver-sqlite", "driver-redis"]
tier-2 = ["driver-mongodb", "driver-clickhouse", "driver-jdbc"]
all    = ["tier-1", "tier-2"]

[dependencies]
adb-types    = { path = "../adb-types",    default-features = false }
adb-support  = { path = "../adb-driver-support", default-features = false }

adb-driver-postgres   = { path = "../adb-driver-postgres",   optional = true, default-features = false }
adb-driver-mysql     = { path = "../adb-driver-mysql",     optional = true, default-features = false }
adb-driver-sqlite    = { path = "../adb-driver-sqlite",    optional = true, default-features = false }
adb-driver-redis     = { path = "../adb-driver-redis",     optional = true, default-features = false }
adb-driver-mongodb   = { path = "../adb-driver-mongodb",   optional = true, default-features = false }
adb-driver-clickhouse = { path = "../adb-driver-clickhouse", optional = true, default-features = false }
adb-driver-jdbc      = { path = "../adb-driver-jdbc",      optional = true, default-features = false }

[dev-dependencies]
adb-driver-postgres = { path = "../adb-driver-postgres", features = ["test-support"] }
adb-driver-mysql   = { path = "../adb-driver-mysql",   features = ["test-support"] }
adb-driver-sqlite  = { path = "../adb-driver-sqlite",  features = ["test-support"] }
