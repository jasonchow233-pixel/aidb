<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="AIDB">
  <!--
    AIDB 横版标识：图标（同 aidb-mark.svg，缩放 112/1024）+ 字标
    字标颜色 = tokens.json 的 text-primary（亮 #0F172A / 暗 #E2E8F0）
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <g transform="translate(24,24) scale(0.109375)">
    <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
    <g fill="#FFFFFF">
      <ellipse cx="470" cy="360" rx="230" ry="86"/>
      <path d="M240 360 V660 a230 86 0 0 0 460 0 V360"/>
    </g>
    <g fill="none" stroke="url(#tile)" stroke-width="34" stroke-linecap="round">
      <path d="M240 480 a230 86 0 0 0 460 0"/>
      <path d="M240 570 a230 86 0 0 0 460 0"/>
    </g>
    <path d="M760 170 Q786 270 886 296 Q786 322 760 422 Q734 322 634 296 Q734 270 760 170 Z" fill="#FFFFFF"/>
  </g>

  <!-- 字标：AIDB，bold，字距 -2% -->
  <text x="160" y="106"
        font-family="System, -apple-system, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1" fill="#0F172A">AIDB</text>
  <!-- 副标：AI 原生数据库工作台 -->
  <text x="162" y="132"
        font-family="System, -apple-system, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="18" font-weight="400" letter-spacing="2" fill="#64748B">AI-NATIVE DATABASE WORKBENCH</text>
</svg>
