<!-- AIDB 自有彩色资产（R43-a 厂商图形）。
     只标 data-paint 角色（edge / tone-a / tone-c），不写颜色 ——
     颜色一律来自 app.css 的 -adb-* 令牌（厂商品牌色见 -adb-vendor-*）。
     ⚠️ 本目录禁止出现任何第三方或竞品的位图/图标资产（他人版权素材）。
     图形是「跃出的鳍 + 一滴水」，读起来像 MySQL 的海豚联想，但不是海豚商标本身。
     视框直接用 16：与 Icons 里单色兜底路径同一套坐标，改形状只改一处口径。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <path data-paint="tone-a" d="M 11.5 2.6 C 12.4 2.6 13.1 3.3 13.1 4.2 C 13.1 5.1 12.4 5.8 11.5 5.8 C 10.6 5.8 9.9 5.1 9.9 4.2 C 9.9 3.3 10.6 2.6 11.5 2.6 Z"/>
  <path data-paint="tone-c" d="M 8 2 C 4.7 2 2 4.7 2 8 C 2 11.3 4.7 14 8 14 C 5.4 11.6 5.4 4.4 8 2 Z"/>
  <path data-paint="edge" d="M 8 2 C 4.7 2 2 4.7 2 8 C 2 11.3 4.7 14 8 14 C 5.4 11.6 5.4 4.4 8 2 Z"/>
</svg>
