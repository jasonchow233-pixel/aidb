# ⭐ R47：这句是照 Connector/J 8.2 的 getPropertyInfo 实测写的 —— 它没有 sslCA / sslCapath，
# 而且驱动对不认识的属性静默忽略（带着 sslCA=/does/not/exist.pem 连 REQUIRED 照样成功）。
# 所以「根证书」这一格对 MySQL 收不了 PEM，能给的只有信任库那条路。
wizard.ssl.mysqlHint=MySQL 这一档只改驱动的 sslMode。Connector/J 8.2 没有 CA 文件参数（既没有 sslCA 也没有 sslCapath，填了会被静默忽略），所以「根证书」这一格收不了 PEM。要校验证书链，把 CA 放进 JVM 信任库，或在「附加参数」里写 trustCertificateKeyStoreUrl 与 trustCertificateKeyStorePassword（PKCS12）。这几档是否真加密、证书校验是否真生效，都在本机 Docker 的 TLS 对端上跑过。
# MariaDB 收 serverSslCert（PEM 直接可用），这一点与 MySQL 不同；R47 把「加密连接本身没跑」那句旧话翻掉了。
wizard.ssl.mariadbHint=MariaDB 驱动用 sslMode（DISABLE / TRUST / VERIFY_CA / VERIFY_FULL），没有 MySQL 的「首选加密」那一档；根证书走 serverSslCert，直接指向 CA 的 PEM 文件。档位取值、加密会话与证书校验都在本机 Docker 的 TLS 对端上跑过：给了签发方就校验通过，换一把没签过服务器证书的 CA 会被拒绝。
wizard.ssl.unavailable=这一家的加密不是一个「档位」能表达的
wizard.ssl.notice.sqlserver=SQL Server 的加密由 encrypt 与 trustServerCertificate 两个参数配对决定（12.x 驱动默认 encrypt=true），单个「TLS 档位」表达不了它。本轮请在「附加参数」里按驱动写法填写，例如 encrypt=false 或 encrypt=true;trustServerCertificate=true。
wizard.ssl.notice.oracle=Oracle Net 的加密不在连接串上：它由 sqlnet.ora、钱包（TLS 认证）与 oracle.net.* 参数一整套决定，单个「TLS 档位」表达不了。本轮请在「附加参数」里按驱动写法填写（如 oracle.net.ssl_server_dn_match=true），且需要客户端网络配置配合。
wizard.ssl.verifyHint=校验档位需要服务端证书链可验证；填「根证书」指向 CA 的 PEM 文件。
