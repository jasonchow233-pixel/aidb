# ============================================================================
# AIDB —— 中文语言包
#
# ⚠️ 这个文件是**从代码里搬出来的原文**，不是翻译目标。
# 2026-10-28 之前这 1404 条字符串硬编码在 77 个 Java 文件里；抽取时逐条照抄，
# 一个字符都不改 —— 这样「切到中文 = 今天的界面」才是可验证的（见 I18nAuditTest）。
# 英文侧（messages_en.properties）才是新写的。
#
# 编码：UTF-8。Properties.load 的 InputStream 入口会按 ISO-8859-1 解，
# 所以 I18n 用的是 Reader 入口 —— 别改回去。
# 占位符：{0} {1} 字面替换，**不是** MessageFormat（撇号会被吃掉，见 I18n 类注释）。
# ============================================================================

