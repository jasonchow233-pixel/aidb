#      / ADB_RENAME / ADB_FILTER。补帧目视抓到两个所有门禁都看不见的缺陷：
#      1) details.title 被写了两次（第十三批「单元格详情」+ 第十九批「对象详情」）。
#         .properties 后写覆盖先写，而键集相等那条门禁比的是 Set —— 抽屉标题被悄悄
#         顶掉而全绿。对象面板改用 details.object.title；重复行由
#         I18nAuditTest.noDuplicateKeyLinesInEitherBundle 守着。
#      2) 界面是英文、弹窗按钮却是中文：那三颗按钮的文字从来不在本文件里 ——
#         JavaFX 的 ButtonType 单例走它自己的 bundle、按 JVM 默认 Locale 解析。
#         现在由 DialogStyles.localizeStandardButtons 用 common.ok|cancel|close 覆写。

