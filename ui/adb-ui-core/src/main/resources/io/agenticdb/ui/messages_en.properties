# ============================================================================
# AIDB —— 英文语言包（**默认语言**）
#
# 2026-10-28 拍板 3：「建 i18n 层，中英双语，默认英文」—— 因为对照实拍里
# Navicat Premium 17 是英文界面。默认英文，不跟随系统 locale（理由见 I18n 类注释）。
#
# 措辞优先级：
#   1. Navicat 实拍里量到的原词，**照抄**（如 Read Only / Last Refresh / Favorites）；
#   2. 官方手册英文版的术语；
#   3. 都没有时按 JavaFX/桌面惯例写，并在中文侧保持同义。
# 键名与 messages_zh.properties **必须完全一致**，由 I18nAuditTest 钉住。
# ============================================================================

