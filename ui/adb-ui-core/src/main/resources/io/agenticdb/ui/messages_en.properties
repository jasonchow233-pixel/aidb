# ⭐ R47: written from Connector/J 8.2's getPropertyInfo, not from docs - there is no
# sslCA / sslCapath, and the driver silently ignores unknown properties
# (sslCA=/does/not/exist.pem still connects fine with sslMode=REQUIRED).
wizard.ssl.mysqlHint=MySQL only changes the driver's sslMode. Connector/J 8.2 has no CA-file option (neither sslCA nor sslCapath; unknown properties are silently ignored), so the Root Certificate field cannot take a PEM file for it. To verify the certificate chain, put the CA in the JVM trust store, or write trustCertificateKeyStoreUrl and trustCertificateKeyStorePassword (PKCS12) in Extra Parameters. Whether these modes really encrypt, and whether certificate verification really runs, was checked against a local Docker TLS peer.
# MariaDB takes serverSslCert (a PEM works directly) - unlike MySQL; R47 retired the old
# "encrypted connections were never run" sentence.
wizard.ssl.mariadbHint=The MariaDB driver uses sslMode (DISABLE / TRUST / VERIFY_CA / VERIFY_FULL) and has no 'prefer encryption' level; the root certificate goes to serverSslCert, pointing straight at the CA's PEM file. The mode values, the encrypted session and certificate verification were all run against a local Docker TLS peer: hand it the issuing CA and verification passes, swap in a CA that never signed the server certificate and the connection is rejected.
wizard.ssl.unavailable=This database's encryption is not something a single 'mode' can express
wizard.ssl.notice.sqlserver=SQL Server encryption is decided by the pair encrypt + trustServerCertificate (the 12.x driver defaults encrypt=true); a single 'TLS mode' cannot express it. For now, write it in Extra Parameters the way the driver expects, e.g. encrypt=false or encrypt=true;trustServerCertificate=true.
wizard.ssl.notice.oracle=Oracle Net encryption is not part of the connection string: it is decided by sqlnet.ora, a wallet (TLS authentication) and the whole set of oracle.net.* parameters, which a single 'TLS mode' cannot express. For now, write it in Extra Parameters the way the driver expects (e.g. oracle.net.ssl_server_dn_match=true); it also needs matching client-side network configuration.
wizard.ssl.verifyHint=Verification modes require a verifiable server certificate chain; point Root Certificate at the CA's PEM file.
