# ─── R34 close-out (2026-10-30). Batches 19-25 moved 275 strings with ZERO frame
#      coverage; six poses + frames now cover them: ADB_SETTINGS / ADB_DIAGNOSTICS
#      / ADB_FAVORITES / ADB_SAVED / ADB_RENAME / ADB_FILTER. Two defects the new
#      frames caught, both invisible to every gate we had:
#      1) details.title was written TWICE (batch 13 "Cell Details", batch 19
#         "Object Details"). .properties is last-write-wins and the key-set gate
#         compares Sets, so the cell drawer silently lost its title. The object
#         panel uses details.object.title now; I18nAuditTest
#         .noDuplicateKeyLinesInEitherBundle keeps duplicate lines out for good.
#      2) Alert / TextInputDialog buttons were Chinese while the UI was English —
#         those labels never came from these bundles: JavaFX resolves the standard
#         ButtonType singletons through its OWN bundle by JVM default locale.
#         DialogStyles.localizeStandardButtons rewrites OK / CANCEL / CLOSE from
#         here now, which is why common.close exists.

