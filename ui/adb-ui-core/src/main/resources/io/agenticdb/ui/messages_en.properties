# ── R34 N1-b 第五批：外壳（AppShell）────────────────────────────────
# 英文术语一律取自本地 Navicat 帧，帧里没有的在下面标了 (inferred)，
# 不许把自己猜的词当成 Navicat 的原样写进文档。
#   · navicat17-object-list-2026-10-27.png → Name / Rows / Data Length /
#     Engine / Modified Date / Comment，页脚 "22 Tables"
#   · navicat17-designer-fields-2026-10-27.png → 页签 Indexes / Foreign Keys /
#     Triggers / Comment，工具条 Primary Key，页脚 "Number of Fields: 15"，
#     属性区 Collation
# 名称/数据长度/引擎/排序规则/注释 复用 column.*（中英两侧文字都一样，同一份真相）。
# 行、创建日期、修改日期 三条**不复用** column.rows/created/updated：
# 那边中文是「行 / 创建日期 / 修改日期」，详情面板原文是「行数 / 创建时间 / 修改时间」，
# 合并就会把中文侧的既有文案改掉 —— 抽取的前提是中文按原文反向对齐。
