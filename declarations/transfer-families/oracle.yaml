# ============================================================
# Oracle 传输家族
#
# ⭐⭐⭐ 这是 DBX `transferObjectFamily` 机制的价值所在。
#
# 达梦、人大金仓(O模式)、OceanBase(Oracle模式)、GBase8s、高斯、
# 南大通用 —— 它们的 DDL 语法、类型映射、标识符引用、IDENTITY 关键字
# 几乎一样。如果每个都写一份，就是 4 份重复代码 + 4 处不一致的 bug。
#
# 成本：新增一个 Oracle 兼容国产库 = 1 个 connections/*.yaml（4 行元信息）
#      + 往这里 members 加 1 个 id。传输规则零改动。
# ============================================================

schemaVersion: 1
id: oracle
label: Oracle 兼容家族

members:
  - oracle
  - dameng              # 达梦
  - oceanbase-oracle    # OceanBase Oracle 模式
  - kingbase-oracle
  - gbase8s
  - highgo              # 高斯

# ⭐ 家族级特性（成员之间一致，无需逐个声明）
supportsTransactionalDdl: false     # Oracle 也不支持事务 DDL
identityKeyword: IDENTITY           # ⭐ 不是 AUTO_INCREMENT（这正是 #12124 的根因）
quoteIdent: '"'

# 类型映射：源家族类型 → 目标家族类型
# lossy: true 意味着可能丢失精度，UI 必须显式提示并要求用户确认
typeMapping:
  NUMBER:
    lossy: true
    to:
      postgres: NUMERIC(38,10)
      mysql: DECIMAL(38,10)
      sqlite: NUMERIC
      sqlserver: DECIMAL(38,10)
  VARCHAR2:
    lossy: false
    to:
      postgres: VARCHAR(4000)
      mysql: VARCHAR(4000)
      sqlite: TEXT
      sqlserver: NVARCHAR(4000)
  NVARCHAR2:
    lossy: false
    to:
      postgres: VARCHAR(2000)
      mysql: VARCHAR(2000)
      sqlite: TEXT
      sqlserver: NVARCHAR(2000)
  CHAR:
    lossy: false
    to: { postgres: CHAR, mysql: CHAR, sqlite: TEXT, sqlserver: CHAR }
  CLOB:
    lossy: false
    to:
      postgres: TEXT
      mysql: LONGTEXT
      sqlite: TEXT
      sqlserver: NVARCHAR(MAX)
  NCLOB:
    lossy: false
    to:
      postgres: TEXT
      mysql: LONGTEXT
      sqlite: TEXT
      sqlserver: NVARCHAR(MAX)
  BLOB:
    lossy: false
    to: { postgres: BYTEA, mysql: LONGBLOB, sqlite: BLOB, sqlserver: VARBINARY(MAX) }
  DATE:
    lossy: true                 # ⭐ Oracle DATE 含时间，PG date 不含 → 必须提示
    to:
      postgres: TIMESTAMP
      mysql: DATETIME
      sqlite: TEXT
      sqlserver: DATETIME2
  TIMESTAMP:
    lossy: true                 # ⭐ 时区语义不同
    to:
      postgres: TIMESTAMPTZ
      mysql: DATETIME(6)
      sqlite: TEXT
      sqlserver: DATETIMEOFFSET
  RAW:
    lossy: false
    to: { postgres: BYTEA, mysql: VARBINARY(255), sqlite: BLOB, sqlserver: VARBINARY }
  ROWID:
    lossy: false
    to: { postgres: BIGINT, mysql: BIGINT, sqlite: INTEGER, sqlserver: BIGINT }
