# ============================================================
# PostgreSQL 传输家族
# ============================================================

schemaVersion: 1
id: postgres
label: PostgreSQL 兼容家族

members:
  - postgresql
  - redshift
  - cockroachdb
  - greenplum
  - opengauss
  - gaussdb             # 高斯（PG 模式）
  - timescaledb

supportsTransactionalDdl: true      # ⭐ PG 家族独有
identityKeyword: GENERATED BY DEFAULT AS IDENTITY
quoteIdent: '"'

typeMapping:
  smallint:
    lossy: false
    to: { mysql: SMALLINT, sqlite: INTEGER, sqlserver: SMALLINT, oracle: NUMBER(5) }
  integer:
    lossy: false
    to: { mysql: INT, sqlite: INTEGER, sqlserver: INT, oracle: NUMBER(10) }
  bigint:
    lossy: false
    to: { mysql: BIGINT, sqlite: INTEGER, sqlserver: BIGINT, oracle: NUMBER(19) }
  numeric:
    lossy: false
    to:
      mysql: DECIMAL(38,10)
      sqlite: NUMERIC
      sqlserver: DECIMAL(38,10)
      oracle: NUMBER(38,10)
  real:
    lossy: true
    to: { mysql: FLOAT, sqlite: REAL, sqlserver: REAL, oracle: BINARY_FLOAT }
  double_precision:
    lossy: true
    to: { mysql: DOUBLE, sqlite: REAL, sqlserver: FLOAT, oracle: BINARY_DOUBLE }
  boolean:
    lossy: false
    to: { mysql: TINYINT(1), sqlite: INTEGER, sqlserver: BIT, oracle: NUMBER(1) }
  varchar:
    lossy: false
    to: { mysql: VARCHAR, sqlite: TEXT, sqlserver: NVARCHAR, oracle: VARCHAR2 }
  text:
    lossy: false
    to: { mysql: LONGTEXT, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: CLOB }
  bytea:
    lossy: false
    to: { mysql: LONGBLOB, sqlite: BLOB, sqlserver: VARBINARY(MAX), oracle: BLOB }
  date:
    lossy: false
    to: { mysql: DATE, sqlite: TEXT, sqlserver: DATE, oracle: DATE }
  timestamp:
    lossy: true
    to: { mysql: DATETIME, sqlite: TEXT, sqlserver: DATETIME2, oracle: TIMESTAMP }
  timestamptz:
    lossy: true
    to: { mysql: DATETIME, sqlite: TEXT, sqlserver: DATETIMEOFFSET, oracle: TIMESTAMP }
  uuid:
    lossy: false
    to: { mysql: CHAR(36), sqlite: TEXT, sqlserver: UNIQUEIDENTIFIER, oracle: VARCHAR2(36) }
  json:
    lossy: false
    to: { mysql: JSON, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: CLOB }
  jsonb:
    lossy: false
    to: { mysql: JSON, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: CLOB }
  serial:
    lossy: false
    to: { mysql: BIGINT AUTO_INCREMENT, sqlite: INTEGER AUTOINCREMENT, sqlserver: INT IDENTITY }
  inet:
    lossy: false
    to: { mysql: VARCHAR(45), sqlite: TEXT, sqlserver: NVARCHAR(45), oracle: VARCHAR2(45) }
