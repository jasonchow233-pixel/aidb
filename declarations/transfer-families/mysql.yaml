# ============================================================
# MySQL 传输家族
# ============================================================

schemaVersion: 1
id: mysql
label: MySQL 兼容家族

members:
  - mysql
  - mariadb
  - tidb
  - oceanbase-mysql
  - polardb-mysql

supportsTransactionalDdl: false     # ⭐ MySQL DDL 隐式提交
identityKeyword: AUTO_INCREMENT
quoteIdent: '`'

typeMapping:
  tinyint:
    lossy: false
    to: { postgres: SMALLINT, sqlite: INTEGER, sqlserver: TINYINT, oracle: NUMBER(3) }
  smallint:
    lossy: false
    to: { postgres: SMALLINT, sqlite: INTEGER, sqlserver: SMALLINT, oracle: NUMBER(5) }
  mediumint:
    lossy: false
    to: { postgres: INTEGER, sqlite: INTEGER, sqlserver: INT, oracle: NUMBER(7) }
  int:
    lossy: false
    to: { postgres: INTEGER, sqlite: INTEGER, sqlserver: INT, oracle: NUMBER(10) }
  bigint:
    lossy: false
    to: { postgres: BIGINT, sqlite: INTEGER, sqlserver: BIGINT, oracle: NUMBER(19) }
  decimal:
    lossy: false
    to:
      postgres: NUMERIC
      sqlite: NUMERIC
      sqlserver: DECIMAL
      oracle: NUMBER
  float:
    lossy: true
    to: { postgres: REAL, sqlite: REAL, sqlserver: REAL, oracle: BINARY_FLOAT }
  double:
    lossy: true
    to: { postgres: DOUBLE PRECISION, sqlite: REAL, sqlserver: FLOAT, oracle: BINARY_DOUBLE }
  bit:
    lossy: false
    to: { postgres: BOOLEAN, sqlite: INTEGER, sqlserver: BIT, oracle: NUMBER(1) }
  varchar:
    lossy: false
    to: { postgres: VARCHAR, sqlite: TEXT, sqlserver: NVARCHAR, oracle: VARCHAR2 }
  text:
    lossy: false
    to: { postgres: TEXT, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: CLOB }
  longtext:
    lossy: false
    to: { postgres: TEXT, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: CLOB }
  binary:
    lossy: false
    to: { postgres: BYTEA, sqlite: BLOB, sqlserver: VARBINARY, oracle: RAW }
  varbinary:
    lossy: false
    to: { postgres: BYTEA, sqlite: BLOB, sqlserver: VARBINARY, oracle: RAW }
  blob:
    lossy: false
    to: { postgres: BYTEA, sqlite: BLOB, sqlserver: VARBINARY(MAX), oracle: BLOB }
  date:
    lossy: false
    to: { postgres: DATE, sqlite: TEXT, sqlserver: DATE, oracle: DATE }
  datetime:
    lossy: true
    to: { postgres: TIMESTAMP, sqlite: TEXT, sqlserver: DATETIME2, oracle: TIMESTAMP }
  timestamp:
    lossy: true                 # ⭐ MySQL timestamp 有 2038 上限 + 时区语义不同
    to: { postgres: TIMESTAMPTZ, sqlite: TEXT, sqlserver: DATETIMEOFFSET, oracle: TIMESTAMP }
  time:
    lossy: false
    to: { postgres: TIME, sqlite: TEXT, sqlserver: TIME, oracle: VARCHAR2(18) }
  year:
    lossy: false
    to: { postgres: SMALLINT, sqlite: INTEGER, sqlserver: SMALLINT, oracle: NUMBER(4) }
  enum:
    lossy: false
    to: { postgres: VARCHAR(255), sqlite: TEXT, sqlserver: NVARCHAR(255), oracle: VARCHAR2(255) }
  set:
    lossy: false
    to: { postgres: TEXT, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: VARCHAR2(1024) }
  json:
    lossy: false
    to: { postgres: JSONB, sqlite: TEXT, sqlserver: NVARCHAR(MAX), oracle: CLOB }
