[workspace]
resolver = "2"
members = [
    "crates/adb-types",
    "crates/adb-secret",
    "crates/adb-drivers",
    "crates/adb-drivers-mysql",
    "crates/adb-drivers-postgres",
    "crates/adb-web"
]

# ⛔ 不 vendor / 不 fork 上游。保持为空 = 架构纪律的一部分。
# [patch.crates-io]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
mysql = { version = "21", features = ["tokio-compat"] }
postgres = { version = "0.19", features = ["with-uuid", "tokio-compat"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
